##
जय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर॥
राम दूत अतुलित बल धामा। अंजनि-पुत्र पवनसुत नामा॥
महाबीर बिक्रम बजरंगी। कुमति निवार सुमति के संगी॥
कंचन बरन बिराज सुबेसा। कानन कुंडल कुंचित केसा॥
हाथ बज्र औ ध्वजा बिराजै। काँधे मूँज जनेऊ साजै॥
संकर सुवन केसरी नंदन। तेज प्रताप महा जग बंदन॥
बिद्यावान गुनी अति चातुर। राम काज करिबे को आतुर॥
प्रभु चरित्र सुनिबे को रसिया। राम लखन सीता मन बसिया॥
सूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥
भीम रूप धरि असुर सँहारे। रामचंद्र के काज सँवारे॥
लाय सजीवन लखन जियाये। श्रीरघुबीर हरषि उर लाये॥
रघुपति कीन्ही बहुत बड़ाई। तुम मम प्रिय भरतहि सम भाई॥
सहस बदन तुम्हरो जस गावैं। अस कहि श्रीपति कंठ लगावैं॥
सनकादिक ब्रह्मादि मुनीसा। नारद सारद सहित अहीसा॥
जम कुबेर दिगपाल जहाँ ते। कबि कोबिद कहि सके कहाँ ते॥
तुम उपकार सुग्रीवहिं कीन्हा। राम मिलाय राज पद दीन्हा॥
तुम्हरो मंत्र बिभीषन माना। लंकेस्वर भए सब जग जाना॥
जुग सहस्र जोजन पर भानू। लील्यो ताहि मधुर फल जानू॥
प्रभु मुद्रिका मेलि मुख माहीं। जलधि लाँघि गये अचरज नाहीं॥
दुर्गम काज जगत के जेते। सुगम अनुग्रह तुम्हरे तेते॥
राम दुआरे तुम रखवारे। होत न आज्ञा बिनु पैसारे॥
सब सुख लहै तुम्हारी सरना। तुम रक्षक काहू को डर ना॥
आपन तेज सम्हारो आपै। तीनों लोक हाँक तें काँपै॥
भूत पिसाच निकट नहिं आवै। महाबीर जब नाम सुनावै॥
नासै रोग हरै सब पीरा। जपत निरंतर हनुमत बीरा॥
संकट तें हनुमान छुड़ावै। मन क्रम बचन ध्यान जो लावै॥
सब पर राम तपस्वी राजा। तिन के काज सकल तुम साजा॥
और मनोरथ जो कोई लावै। सोई अमित जीवन फल पावै॥
चारों जुग परताप तुम्हारा। है परसिद्ध जगत उजियारा॥
साधु संत के तुम रखवारे। असुर निकंदन राम दुलारे॥
अष्ट सिद्धि नौ निधि के दाता। अस बर दीन जानकी माता॥
राम रसायन तुम्हरे पासा। सदा रहो रघुपति के दासा॥
तुम्हरे भजन राम को पावै। जनम जनम के दुख बिसरावै॥
अंत काल रघुबर पुर जाई। जहाँ जन्म हरि-भक्त कहाई॥
और देवता चित्त न धरई। हनुमत सेइ सर्ब सुख करई॥
संकट कटै मिटै सब पीरा। जो सुमिरै हनुमत बलबीरा॥
जै जै जै हनुमान गोसाईं। कृपा करहु गुरु देव की नाईं॥
जो सत बार पाठ कर कोई। छूटहि बंदि महा सुख होई॥
जो यह पढ़ै हनुमान चालीसा। होय सिद्धि साखी गौरीसा॥
तुलसीदास सदा हरि चेरा। कीजै नाथ हृदय महँ डेरा॥

var $=function(i){return document.getElementById(i)},R={},sel=new Date(),vm=new Date(),fs=20;
var H={};try{R=JSON.parse(localStorage.getItem('gitaRead')||'{}')}catch(e){}
try{H=JSON.parse(localStorage.getItem('chalRead')||'{}')}catch(e){}
function save(){try{localStorage.setItem('gitaRead',JSON.stringify(R));localStorage.setItem('chalRead',JSON.stringify(H))}catch(e){}}
function ft(s){if(!s||s===1)return 'time not recorded';var d=new Date(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function cs(){var k=key(sel),h=H[k];$('cdone').textContent=h?'Chalisa finished ✓ (tap to undo)':'I finished Hanuman Chalisa ✓';$('crec').innerHTML='<b>'+sel.toLocaleDateString(undefined,{day:'numeric',month:'short'})+':</b> '+(h?'finished '+ft(h):'not yet recorded')}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function idx(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5)}
var off=0;
function show(){var d=new Date(sel);d.setDate(d.getDate());var gi=(idx(d)+off+G.length*400)%G.length,g=G[gi];
$('ref').textContent='Bhagavad Gita · '+g[0]+' · '+d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
$('sa').innerHTML=g[1].replace('\n','<br>')+'<span class="ro">'+GR[gi].replace('\n','<br>')+'</span>';$('mn').innerHTML='<b>Meaning:</b> '+g[2];
var k=key(d),r=R[k];$('done').textContent=r?'Shloka finished ✓ (tap to undo)':'I finished today’s shloka ✓';$('done').style.opacity=r?.75:1;$('rec').innerHTML='<b>Gita:</b> '+(r?ft(r):'not yet')+'<br><b>Hanuman Chalisa:</b> '+(H[k]?ft(H[k]):'not yet');cs();stats();grid()}
function stats(){var n=new Date(),s=0,c=new Date(n);if(!R[key(c)])c.setDate(c.getDate()-1);while(R[key(c)]){s++;c.setDate(c.getDate()-1)}
var m=0;for(var k in R){var p=k.split('-');if(+p[0]==n.getFullYear()&&+p[1]==n.getMonth()+1)m++}
$('st1').textContent=s;$('st2').textContent=m;$('st3').textContent=Object.keys(R).length}
function grid(){var y=vm.getFullYear(),m=vm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),h='';
$('mt').textContent=vm.toLocaleDateString(undefined,{month:'long',year:'numeric'});
'SMTWTFS'.split('').forEach(function(x){h+='<div class="h">'+x+'</div>'});
for(var i=0;i<f;i++)h+='<div></div>';
for(var d=1;d<=n;d++){var dt=new Date(y,m,d),c=(R[key(dt)]?' read':'')+(H[key(dt)]?' hc':'')+(key(dt)==key(new Date())?' today':'')+(key(dt)==key(sel)?' sel':'');h+='<button class="'+c.trim()+'" data-d="'+d+'">'+d+'</button>'}
$('grid').innerHTML=h}
function tick(){var n=new Date();$('clk').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('dt').textContent=n.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function chal(){var p=C.split('##'),t=['॥ दोहा ॥','॥ चौपाई ॥','॥ दोहा ॥'],h='';p.forEach(function(b,i){h+='<h3>'+t[i]+'</h3>';var rp=CR.split('##')[i].trim().split('\n');b.trim().split('\n').forEach(function(l,j){h+='<p>'+l+'<span class="ro">'+(rp[j]||'')+'</span></p>'})});$('cb').innerHTML=h}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');['today','cal','chal'].forEach(function(s){$(s).classList.toggle('hide',s!=b.dataset.t)});window.scrollTo(0,0)}});
$('grid').onclick=function(e){var d=e.target.dataset.d;if(d){sel=new Date(vm.getFullYear(),vm.getMonth(),+d);off=0;show();document.querySelector('.tabs button').click()}};
$('done').onclick=function(){var k=key(sel);if(R[k])delete R[k];else R[k]=new Date().toISOString();save();show()};
$('next').onclick=function(){off++;show()};$('prev').onclick=function(){off--;show()};
$('pm').onclick=function(){vm.setMonth(vm.getMonth()-1);grid()};$('nm').onclick=function(){vm.setMonth(vm.getMonth()+1);grid()};
$('fp').onclick=function(){fs=Math.min(34,fs+2);document.documentElement.style.setProperty('--fs',fs+'px')};
$('fm').onclick=function(){fs=Math.max(15,fs-2);document.documentElement.style.setProperty('--fs',fs+'px')};
$('cdone').onclick=function(){var k=key(sel);if(H[k])delete H[k];else H[k]=new Date().toISOString();save();show()};
tick();setInterval(tick,1000);chal();show();
</script></body></html>
